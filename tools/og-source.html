<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", sans-serif;
        background:
          radial-gradient(600px 400px at 85% 20%, rgba(124, 58, 237, 0.35), transparent 60%),
          radial-gradient(500px 400px at 10% 90%, rgba(79, 70, 229, 0.3), transparent 60%),
          #0b0b0d;
        color: #f5f5f4;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(245, 245, 244, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 245, 244, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }
      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px 84px;
        gap: 28px;
      }
      .badge {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #2a2a30;
        background: #151518;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 20px;
        font-weight: 600;
        color: #a8a29e;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
      h1 {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #818cf8, #a78bfa 55%, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role { font-size: 40px; font-weight: 700; color: #f5f5f4; }
      .tags { display: flex; gap: 14px; margin-top: 6px; }
      .tag {
        border: 1px solid #2a2a30;
        background: #151518;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 22px;
        font-weight: 600;
        color: #d6d3d1;
      }
      .url {
        position: absolute;
        right: 84px;
        bottom: 64px;
        font-size: 26px;
        font-weight: 600;
        color: #a8a29e;
      }
      .monogram {
        position: absolute;
        right: 84px;
        top: 72px;
        width: 170px;
        height: 170px;
        border-radius: 36px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #db2777);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 76px;
        font-weight: 800;
        color: #fff;
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <span class="badge"><span class="dot"></span> Tersedia untuk proyek freelance</span>
      <h1>Andika Tri Handoyo</h1>
      <div class="role">Full Stack Developer</div>
      <div class="tags">
        <span class="tag">Laravel</span>
        <span class="tag">Vue.js</span>
        <span class="tag">REST API</span>
        <span class="tag">AI Integration</span>
      </div>
      <div class="url">andikatri2710.github.io</div>
      <div class="monogram">AH</div>
    </div>
  </body>
</html>
